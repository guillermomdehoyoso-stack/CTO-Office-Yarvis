services:
  api:
    build:
      context: ./apps/api
    working_dir: /app
    volumes:
      - ./apps/api:/app
      - ./data:/data
    command: sh -c "pip install -r requirements.txt && uvicorn yarvis_api.main:app --app-dir src --host 0.0.0.0 --port 8000"
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-yarvis}:${POSTGRES_PASSWORD:-yarvis}@postgres:5432/${POSTGRES_DB:-yarvis}
      PYTHONPATH: /app/src
      DOCUMENT_STORAGE_ROOT: /data/yarvis
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yarvis}
      POSTGRES_USER: ${POSTGRES_USER:-yarvis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yarvis}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./apps/web:/app
    command: sh -c "npm install && npm run dev"
    ports:
      - "127.0.0.1:5173:5173"

volumes:
  pgdata:
