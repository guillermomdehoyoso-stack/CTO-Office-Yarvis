services:
  api:
    build:
      context: ./apps/api
    working_dir: /app
    volumes:
      - ./apps/api:/app
      # Governed read-only Workspace corpus; API source and runtime data stay separate.
      - ./AGENTS.md:/workspace-repository/AGENTS.md:ro
      - ./docs/development:/workspace-repository/docs/development:ro
      - ./docs/engineering:/workspace-repository/docs/engineering:ro
      # Required only to discover the WS-000 manifest; no other application code is mounted here.
      - ./apps/api/workspaces:/workspace-repository/apps/workspaces:ro
      - ./data:/data
    command: sh -c "pip install -r requirements.txt && uvicorn yarvis_api.main:app --app-dir src --host 0.0.0.0 --port 8000"
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      YARVIS_ENVIRONMENT: local
      YARVIS_DATABASE_URL: postgresql://${POSTGRES_USER:-yarvis}:${POSTGRES_PASSWORD:-yarvis}@postgres:5432/${POSTGRES_DB:-yarvis}
      PYTHONPATH: /app/src
      YARVIS_DOCUMENT_STORAGE_ROOT: /data/yarvis
      YARVIS_WORKSPACE_REPOSITORY_ROOT: /workspace-repository
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yarvis}
      POSTGRES_USER: ${POSTGRES_USER:-yarvis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yarvis}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./apps/web:/app
    command: sh -c "npm install && npm run dev"
    ports:
      - "127.0.0.1:5173:5173"

volumes:
  pgdata:
