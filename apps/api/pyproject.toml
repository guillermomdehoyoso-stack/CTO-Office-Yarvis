[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yarvis-api"
version = "0.1.0"
description = "Yarvis modular-monolith API package"
requires-python = ">=3.12,<3.13"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 120
include = ["src/yarvis_api/config.py", "tests/architecture/**/*.py", "tests/test_config.py"]
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["yarvis_api"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["src/yarvis_api/config.py", "tests/architecture", "tests/test_config.py"]
exclude = ["migrations"]
typeCheckingMode = "basic"
pythonVersion = "3.12"
reportMissingImports = "error"
