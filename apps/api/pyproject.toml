[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yarvis-api"
version = "0.1.0"
description = "Yarvis modular-monolith API package"
requires-python = ">=3.12,<3.13"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 120
include = [
    "src/yarvis_api/bootstrap.py",
    "src/yarvis_api/canonical_contracts.py",
    "src/yarvis_api/canonical_modules.py",
    "src/yarvis_api/config.py",
    "src/yarvis_api/database.py",
    "src/yarvis_api/contract_registry.py",
    "src/yarvis_api/dispatch/**/*.py",
    "src/yarvis_api/main.py",
    "src/yarvis_api/module_registry.py",
    "src/yarvis_api/persistence/**/*.py",
    "tests/architecture/**/*.py",
    "tests/test_bootstrap.py",
    "tests/test_canonical_contracts.py",
    "tests/test_canonical_modules.py",
    "tests/test_config.py",
    "tests/test_contract_registry.py",
    "tests/test_dispatcher.py",
    "tests/test_handler_registry.py",
    "tests/test_module_registry.py",
    "tests/test_persistence_runtime.py",
    "tests/test_unit_of_work.py",
]
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["yarvis_api"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["src/yarvis_api/bootstrap.py", "src/yarvis_api/canonical_contracts.py", "src/yarvis_api/canonical_modules.py", "src/yarvis_api/config.py", "src/yarvis_api/contract_registry.py", "src/yarvis_api/database.py", "src/yarvis_api/dispatch", "src/yarvis_api/main.py", "src/yarvis_api/module_registry.py", "src/yarvis_api/persistence", "tests/architecture", "tests/conftest.py", "tests/test_bootstrap.py", "tests/test_canonical_contracts.py", "tests/test_canonical_modules.py", "tests/test_config.py", "tests/test_contract_registry.py", "tests/test_dispatcher.py", "tests/test_handler_registry.py", "tests/test_module_registry.py", "tests/test_persistence_runtime.py", "tests/test_unit_of_work.py"]
exclude = ["migrations"]
typeCheckingMode = "basic"
pythonVersion = "3.12"
reportMissingImports = "error"
