# DigitalOcean App Platform runtime template for the restricted Yarvis pilot.
# Before applying, set a region co-located with the approved Managed PostgreSQL
# cluster and replace only the __REQUIRES_*__ secret/callback markers out of Git.
name: yarvis-pilot
services:
  - name: yarvis-pilot
    github:
      repo: guillermomdehoyoso-stack/CTO-Office-Yarvis
      branch: feat/operational-intake-spine
      deploy_on_push: false
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /health
      initial_delay_seconds: 20
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
      port: 8080
    envs:
      - key: YARVIS_ENVIRONMENT
        value: production
        scope: RUN_TIME
        type: GENERAL
      - key: YARVIS_AUTH_MODE
        value: oidc
        scope: RUN_TIME
        type: GENERAL
      - key: YARVIS_API_DOCS_ENABLED
        value: "false"
        scope: RUN_TIME
        type: GENERAL
      - key: YARVIS_API_PORT
        value: "8080"
        scope: RUN_TIME
        type: GENERAL
      - key: YARVIS_WEB_STATIC_ROOT
        value: /app/web
        scope: RUN_TIME
        type: GENERAL
      - key: YARVIS_WORKSPACE_REPOSITORY_ROOT
        value: /workspace-repository
        scope: RUN_TIME
        type: GENERAL
      - key: YARVIS_DOCUMENT_STORAGE_ROOT
        value: /var/yarvis-documents
        scope: RUN_TIME
        type: GENERAL
      - key: YARVIS_SESSION_COOKIE_NAME
        value: __Host-yarvis_session
        scope: RUN_TIME
        type: GENERAL
      - key: YARVIS_SESSION_IDLE_SECONDS
        value: "1800"
        scope: RUN_TIME
        type: GENERAL
      - key: YARVIS_SESSION_ABSOLUTE_SECONDS
        value: "28800"
        scope: RUN_TIME
        type: GENERAL
      - key: YARVIS_SESSION_MAX_ACTIVE
        value: "3"
        scope: RUN_TIME
        type: GENERAL
      - key: YARVIS_BOOTSTRAP_ENABLED
        value: "false"
        scope: RUN_TIME
        type: GENERAL
      - key: YARVIS_BOOTSTRAP_WINDOW_SECONDS
        value: "86400"
        scope: RUN_TIME
        type: GENERAL
      - key: YARVIS_AUTH_DEPLOYMENT_REPLICAS
        value: "1"
        scope: RUN_TIME
        type: GENERAL
      - key: YARVIS_AUTH_RATE_LIMIT_BACKEND
        value: memory
        scope: RUN_TIME
        type: GENERAL
      - key: YARVIS_AUTH_CLEANUP_SESSION_RETENTION_DAYS
        value: "7"
        scope: RUN_TIME
        type: GENERAL
      - key: YARVIS_OIDC_ISSUER
        value: __REQUIRES_GOOGLE_WORKSPACE_ISSUER__
        scope: RUN_TIME
        type: GENERAL
      - key: YARVIS_OIDC_CLIENT_ID
        value: __REQUIRES_GOOGLE_WORKSPACE_CLIENT_ID__
        scope: RUN_TIME
        type: GENERAL
      - key: YARVIS_OIDC_REDIRECT_URI
        value: __REQUIRES_EXACT_APP_PLATFORM_CALLBACK__
        scope: RUN_TIME
        type: GENERAL
      - key: YARVIS_OIDC_POST_LOGIN_REDIRECT_ALLOWLIST
        value: /
        scope: RUN_TIME
        type: GENERAL
      - key: YARVIS_CORS_ORIGINS
        value: __REQUIRES_EXACT_APP_PLATFORM_ORIGIN__
        scope: RUN_TIME
        type: GENERAL
      - key: YARVIS_CSRF_ALLOWED_ORIGINS
        value: __REQUIRES_EXACT_APP_PLATFORM_ORIGIN__
        scope: RUN_TIME
        type: GENERAL
      - key: YARVIS_DATABASE_URL
        value: __REQUIRES_RUNTIME_DATABASE_URL_FOR_YARVIS_APP__
        scope: RUN_TIME
        type: SECRET
      - key: YARVIS_OIDC_CLIENT_SECRET
        value: __REQUIRES_OIDC_CLIENT_SECRET__
        scope: RUN_TIME
        type: SECRET
      - key: YARVIS_OIDC_ATTEMPT_ENCRYPTION_KEY
        value: __REQUIRES_OIDC_ATTEMPT_ENCRYPTION_KEY__
        scope: RUN_TIME
        type: SECRET
