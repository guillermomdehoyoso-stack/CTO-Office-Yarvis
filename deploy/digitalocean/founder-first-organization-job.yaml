# Separate, one-shot administrative runner for IC-GOVERNANCE-CMD-006 only.
# Do not merge into app.yaml, migration-job.yaml, a selector, or enrollment.
name: yarvis-pilot-first-org
jobs:
  - name: yarvis-create-first-org
    kind: PRE_DEPLOY
    github:
      repo: guillermomdehoyoso-stack/CTO-Office-Yarvis
      branch: feat/operational-intake-spine
      deploy_on_push: false
    dockerfile_path: Dockerfile
    run_command: >-
      sh -ec 'umask 077; authorization_file="$(mktemp /tmp/yarvis-first-organization.XXXXXX)"; trap '"'"'rm -f "$authorization_file"'"'"' EXIT HUP INT TERM; printf %s "$YARVIS_FOUNDER_FIRST_ORGANIZATION_AUTHORIZATION" > "$authorization_file"; unset YARVIS_FOUNDER_FIRST_ORGANIZATION_AUTHORIZATION; PYTHONPATH=/app/src python -m yarvis_api.founder_bootstrap_cli create-first-organization --authorization-file "$authorization_file"'
    instance_size_slug: apps-s-1vcpu-0.5gb
    envs:
      - key: YARVIS_ENVIRONMENT
        value: production
        scope: RUN_TIME
        type: GENERAL
      - key: YARVIS_FOUNDER_BOOTSTRAP_DATABASE_URL
        value: __REQUIRES_FOUNDER_BOOTSTRAP_DATABASE_URL__
        scope: RUN_TIME
        type: SECRET
      - key: YARVIS_FOUNDER_BOOTSTRAP_ENABLED
        value: __REQUIRES_FOUNDER_BOOTSTRAP_ENABLED_FOR_SINGLE_RUN__
        scope: RUN_TIME
        type: SECRET
      - key: YARVIS_FOUNDER_BOOTSTRAP_PUBLIC_KEY
        value: __REQUIRES_FOUNDER_BOOTSTRAP_PUBLIC_KEY__
        scope: RUN_TIME
        type: SECRET
      - key: YARVIS_FOUNDER_BOOTSTRAP_KEY_ID
        value: __REQUIRES_FOUNDER_BOOTSTRAP_KEY_ID__
        scope: RUN_TIME
        type: SECRET
      - key: YARVIS_FOUNDER_FIRST_ORGANIZATION_AUTHORIZATION
        value: __REQUIRES_FOUNDER_FIRST_ORGANIZATION_AUTHORIZATION__
        scope: RUN_TIME
        type: SECRET
